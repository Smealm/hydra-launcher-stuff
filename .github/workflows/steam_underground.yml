name: Daily SteamUnderground Scrape

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false  # Will push using PAT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: "hydra sources/FMHY/steam undergound"

      - name: Run SteamUnderground scraper
        run: |
          python steamunderground-hydra.py
        working-directory: "hydra sources/FMHY/steam undergound"

      - name: Commit and push updated JSON directly to main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd "hydra sources/FMHY/steam undergound"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout main
          git reset --hard origin/main

          git add steamunderground.json

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update steamunderground.json [skip ci]"
          git push https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git HEAD:main
