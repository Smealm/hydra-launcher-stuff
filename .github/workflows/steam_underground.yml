name: Daily SteamUnderground Scrape

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at 00:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: "hydra sources/FMHY/steam undergound"

      # 4. Run scraper
      - name: Run SteamUnderground scraper
        run: |
          python steamunderground-hydra.py
        working-directory: "hydra sources/FMHY/steam undergound"

      # 5. Commit to a temporary branch
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b update/steamunderground || git checkout update/steamunderground
          git add steamunderground.json
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "Update steamunderground.json [skip ci]"
          git push --force-with-lease https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }} HEAD:update/steamunderground

      # 6. Create or update pull request
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "Update steamunderground.json [skip ci]"
          branch: update/steamunderground
          base: main
          title: "Daily update: steamunderground.json"
          body: "Automated update of steamunderground.json via GitHub Actions."
          draft: false
          merge-method: "merge"
