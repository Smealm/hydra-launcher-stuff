name: Daily SteamUnderground Scrape

# Run daily at 00:00 UTC, or you can trigger manually
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: "hydra sources/FMHY/steam undergound"

      # Step 4: Run the scraper
      - name: Run SteamUnderground scraper
        run: |
          python steamunderground-hydra.py
        working-directory: "hydra sources/FMHY/steam undergound"

      # Step 5: Commit and push the updated JSON
      - name: Commit and push JSON
        env:
          GH_PAT: ${{ secrets.GH_PAT }}  # <-- You must create this secret
        run: |
          cd "hydra sources/FMHY/steam undergound"

          # Configure Git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Create a branch for the update
          git checkout -B update/steamunderground

          # Add JSON and commit if changed
          git add steamunderground.json
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update steamunderground.json [skip ci]"

          # Push using the personal access token
          git push --force-with-lease https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY} HEAD:update/steamunderground
