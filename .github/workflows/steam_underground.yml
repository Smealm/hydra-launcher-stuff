name: Daily SteamUnderground Scrape

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false  # Don't use default GitHub token

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: "hydra sources/FMHY/steam undergound"

      - name: Run SteamUnderground scraper
        run: |
          python steamunderground-hydra.py
        working-directory: "hydra sources/FMHY/steam undergound"

      - name: Commit and push updated JSON
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd "hydra sources/FMHY/steam undergound"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Make sure we have the latest remote branch state
          git fetch origin update/steamunderground || true

          # Create or switch to branch
          git checkout -B update/steamunderground origin/update/steamunderground || git checkout -B update/steamunderground

          # Add JSON and commit if it changed
          git add steamunderground.json
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update steamunderground.json [skip ci]"

          # Push with overwrite (safe rebase behavior)
          git push --force-with-lease https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git update/steamunderground
