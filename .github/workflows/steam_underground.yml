name: Daily SteamUnderground Scrape

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: false  # We will push using PAT instead

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: "hydra sources/FMHY/steam undergound"

      - name: Run SteamUnderground scraper
        run: |
          python steamunderground-hydra.py
        working-directory: "hydra sources/FMHY/steam undergound"

      - name: Commit and push updated JSON
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd "hydra sources/FMHY/steam undergound"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Fetch remote branch if it exists
          git fetch origin update/steamunderground || true

          # Reset to remote branch or wipe to HEAD if branch doesn't exist yet
          git reset --hard origin/update/steamunderground || git reset --hard

          # Create or move to update branch
          git checkout -B update/steamunderground

          # Stage updated JSON
          git add steamunderground.json

          # Skip commit if there are no changes
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          # Commit with skip-ci to prevent loops
          git commit -m "Update steamunderground.json [skip ci]"

          # Force push so branch always matches latest scrape result
          git push --force https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git HEAD:update/steamunderground
