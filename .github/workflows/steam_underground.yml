name: Daily SteamUnderground Scrape

on:
  schedule:
    - cron: "0 0 * * *"  # Runs once daily at 00:00 UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: "hydra sources/FMHY/steam undergound"

      # Step 4: Run the scraper
      - name: Run SteamUnderground scraper
        run: python steamunderground-hydra.py
        working-directory: "hydra sources/FMHY/steam undergound"

      # Step 5: Commit and push updated JSON using PAT
      - name: Commit and push updated JSON
        env:
          GH_PAT: ${{ secrets.GH_PAT }}  # Use the PAT you created
        working-directory: "hydra sources/FMHY/steam undergound"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add steamunderground.json
          if ! git diff --cached --quiet; then
            git commit -m "Update steamunderground.json [skip ci]"
            git push https://x-access-token:${GH_PAT}@github.com/Smealm/hydra-launcher-stuff.git HEAD:main
            echo "JSON updated and pushed."
          else
            echo "No changes detected. Skipping commit."
          fi
